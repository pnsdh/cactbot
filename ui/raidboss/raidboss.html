<html lang="en-US">
<head>
  <meta charset="utf-8" />
  <title>Cactbot Raidboss</title>
</head>
<body>
<div id="container">
  <div id="timeline-container">
    <div class="resize-helper">
      <div id="timeline-resize-helper" class="timeline-grid"></div>
    </div>
    <div id="timeline-debug" class="just-a-number"></div>
    <div id="timeline" class="timeline-grid"></div>
  </div>

  <div id="popup-text-container">
    <div id="popup-text-alarm" class="text">
      <div class="holder"></div>
      <div class="holder resize-helper">
        <div id="instructions-0" class="alarm-text"></div>
        <div id="instructions-1" class="alarm-text"></div>
      </div>
    </div>
    <div id="popup-text-alert" class="text">
      <div class="holder"></div>
      <div class="holder resize-helper">
        <div id="instructions-2" class="alert-text"></div>
        <div id="instructions-3" class="alert-text"></div>
      </div>
    </div>
    <div id="popup-text-info" class="text">
      <div class="holder"></div>
      <div class="holder resize-helper">
        <div id="instructions-4" class="info-text"></div>
        <div id="instructions-5" class="info-text"></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
