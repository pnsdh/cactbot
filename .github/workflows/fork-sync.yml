# Fork-only: merges upstream (OverlayPlugin/cactbot) main into this fork's main when it merges
# cleanly and tests pass. On conflict or failure nothing is pushed and an issue is opened
# (closed again automatically on the next successful run, e.g. after a manual merge).
# Triggers Fork Release whenever upstream's version has no fork release yet.
# Requires secret SYNC_TOKEN: fine-grained PAT for this repo with Contents + Workflows
# read/write (GITHUB_TOKEN can neither push upstream's workflow changes nor trigger CI).
name: Fork Sync

on:
  schedule:
    - cron: '23 */2 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    concurrency:
      group: fork-sync
    permissions:
      actions: write
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_TITLE: '[fork-sync] upstream sync failed'
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Merge Upstream
        id: merge
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config merge.ours.driver true
          git remote add upstream https://github.com/OverlayPlugin/cactbot.git
          git fetch --no-tags upstream main
          echo "upstream_sha=$(git rev-parse upstream/main)" >> $GITHUB_OUTPUT
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "::notice::Already up to date with upstream."
            echo "status=uptodate" >> $GITHUB_OUTPUT
            exit 0
          fi
          if git merge --no-edit upstream/main; then
            echo "status=merged" >> $GITHUB_OUTPUT
          else
            git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicts.txt"
            git merge --abort
            echo "status=conflict" >> $GITHUB_OUTPUT
            echo "::error::Merge conflict with upstream:"
            cat "$RUNNER_TEMP/conflicts.txt"
            exit 1
          fi

      - uses: ./.github/actions/setup-js-env
        if: steps.merge.outputs.status == 'merged'

      - name: Test Merged Tree
        if: steps.merge.outputs.status == 'merged'
        run: |
          npm run tsc-no-emit
          npm test

      - name: Push
        if: steps.merge.outputs.status == 'merged'
        run: |
          git push origin HEAD:main

      - name: Trigger Release If Needed
        shell: bash
        run: |
          base=$(node -p "require('./package.json').version")
          if [ -z "$(git tag -l "v${base}.*")" ]; then
            echo "::notice::No fork release for upstream ${base} yet. Triggering Fork Release."
            gh workflow run fork-release.yml --ref main
          fi

      - name: Close Sync Issue
        shell: bash
        run: |
          num=$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" \
            --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue close "$num" --comment "Upstream sync succeeded: $RUN_URL"
          fi

      - name: Report Failure
        if: failure()
        shell: bash
        env:
          STATUS: ${{ steps.merge.outputs.status }}
          UPSTREAM_SHA: ${{ steps.merge.outputs.upstream_sha }}
        run: |
          if [ "$STATUS" = "conflict" ]; then
            body="Merge conflict with upstream \`$UPSTREAM_SHA\`. Conflicting files:"
            body+=$'\n\n'"$(sed 's/^/- `/; s/$/`/' "$RUNNER_TEMP/conflicts.txt")"
            body+=$'\n\n'"Resolve locally, then push:"
            body+=" \`git fetch upstream && git merge upstream/main\`"
          else
            body="Sync failed after merging upstream \`$UPSTREAM_SHA\` (test or push)."
          fi
          body+=$'\n\n'"Run: $RUN_URL"
          num=$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" \
            --json number --jq '.[0].number // empty')
          if [ -z "$num" ]; then
            gh issue create --title "$ISSUE_TITLE" --body "$body"
          elif ! gh issue view "$num" --comments --json body,comments \
            --jq '[.body] + [.comments[].body] | join("\n")' | grep -q "$UPSTREAM_SHA"; then
            gh issue comment "$num" --body "$body"
          fi
